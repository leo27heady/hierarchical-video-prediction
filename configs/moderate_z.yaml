# Canonical WORKING recipe: moderate in-plane (Z-only) motion -> stable training + recognizable/sharp
# single-step predictions (~22-23 dB, near the 24.7 dB oracle ceiling). See docs/PREDICTION_FINDINGS.md.
# Reproduce the data:  <SEED-Voken venv python> scripts/gen_data_simple_z.py --preset moderate
# Inspect predictions:  venv\Scripts\python.exe scripts/debug_prediction.py --ckpt logs/moderate_z/oneshot/last.pt
_base_: base_64.yaml

data:
  train_hash: a34e023fd69e        # Z-only, moderate 8-16 deg/frame, 1-3 cubes, 64px, 400 clips
  val_hash: cc5bd1b9e7c2          # 100 clips (true cross-split)
  val_long_hash: cc5bd1b9e7c2
  image_size: 64

predictor:
  head: l2                        # the warp head gives only +0.3-0.9 dB here; l2 is the simple baseline
  stage_pred_weight: [1.0, 0.5, 0.25]   # favor the finest stage (coarse stages can't extrapolate rotation)

optim:
  max_steps: 3000

run:
  out_dir: logs/moderate_z
  val_every: 500
  save_every: 3000
  wandb: false
  wandb_name: moderate-z
