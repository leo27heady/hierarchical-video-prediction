# P2.1 — K=1 grad-enabled self-feedback (the cheapest anti-drift falsification).
# SO(3) + GMM head + the self-rollout term: the cascade consumes its OWN detached prediction for one
# step and is supervised (NLL) against the within-window GT latents 2 ahead. No new data needed (K=1).
# Run this vs an identical control with --set predictor.sched.lambda_rollout=0.0 run.out_dir=logs/so3_p2_ctrl
_base_: so3_64.yaml

predictor:
  head: gmm
  head_components: 4
  lambda_pred: 0.02
  sched:
    rollout_enabled: true
    rollout_steps: 1
    lambda_rollout: 0.05          # the self-rollout weight (control sets this to 0.0)
    rollout_warmup_steps: 400     # ramps after pred_warmup (600) -> active by ~step 1000
    sample_rollout: false         # head_mode feedback (lead with the stable point; sampled = P2.3)
    detach_feedback: true

optim:
  max_steps: 2000

run:
  out_dir: logs/so3_p2
