# The R1/R2 recipe scaled to the 128px / 2->8->32 target on MODERATE SO(3) motion (the original goal).
# T=17 (more context) is INFEASIBLE at 128 (BOT 32^2 x 17 = 17408 self-attention tokens), so this keeps
# T=9 and applies the other levers: larger BOT-focused predictor + warp head + moderate motion.
# batch_size/stage_dims may be trimmed after scripts/probe_128.py confirms memory.
_base_: so3_128.yaml          # 128px -> BOT 32 / MID 8 / TOP 2, T=9

data:
  train_hash: 96e3b8e4df6a    # moderate SO(3) (xyz), 128px, T=9, 8-16 deg/frame, 1-3 cubes, 400 clips
  val_hash: bd688ce90315      # 100 clips
  val_long_hash: bd688ce90315

predictor:
  head: warp
  # GRAD-CHECKPOINTING lets the larger BOT (R1's capacity lever) fit at 128 (8.5 GB vs OOM). T=17 is
  # still infeasible (that's the attention SCORE matrix, not activations) -> keep T=9. Recipe here =
  # larger BOT-focused predictor + warp + moderate motion (the only missing lever vs R1/R2 is T=17).
  grad_checkpoint: true
  stage_dims: [256, 192, 128]      # larger BOT (capacity); bot >= coarse
  stage_heads: [8, 8, 8]
  stage_layers: [6, 4, 3]
  stage_pred_weight: [1.0, 0.25, 0.1]   # BOT-focused
  lambda_pred: 0.25                # OVERRIDE so3_128's 0.02 (GMM-NLL scale); the warp head uses MSE
  pred_warmup_steps: 800

optim:
  batch_size: 4
  accum_steps: 2                   # effective batch 8 (matches R1/R2); grad-checkpoint slows steps
  max_steps: 3500

run:
  out_dir: logs/so3_128_recipe
  val_every: 500
  save_every: 1000
  wandb: false
  wandb_name: so3-128-recipe
