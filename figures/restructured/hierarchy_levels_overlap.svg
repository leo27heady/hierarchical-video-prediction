<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840"><rect width="1000" height="840" fill="white"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#172c3e"><text x="24" y="35" font-size="27" font-weight="bold">Масштаби та перекриття представлень</text><rect x="24" y="55" width="952" height="150" rx="8" fill="#edf3f7" stroke="#667789"/><text x="44" y="85" font-size="23" font-weight="bold">А. Кількість рівнів за бюджету 1 792</text><text x="44" y="119" font-size="20" font-weight="normal">Один: 28 × 64 детальних токенів.</text><text x="44" y="149" font-size="20" font-weight="normal">Два: грубі + детальні токени за опорною політикою ALC.</text><text x="44" y="179" font-size="20" font-weight="normal">Три: 96 × 4 = 384 верхніх; ще 1 408 грубих / детальних.</text><text x="44" y="240" font-size="19" font-weight="normal">Розподіл залишку визначається залежністю, а не результатом LVL.</text><rect x="24" y="265" width="952" height="175" rx="8" fill="#edf3f7" stroke="#667789"/><text x="44" y="295" font-size="23" font-weight="bold">Б. Вкладене подання</text><rect x="24" y="455" width="952" height="175" rx="8" fill="#edf3f7" stroke="#667789"/><text x="44" y="485" font-size="23" font-weight="bold">В. Взаємовиключне подання</text><rect x="24" y="645" width="952" height="175" rx="8" fill="#edf3f7" stroke="#667789"/><text x="44" y="675" font-size="23" font-weight="bold">Г. Залишкове подання</text><rect x="65.0" y="313.0" width="36.0" height="36.0" fill="#cfe9de" stroke="#667789"/><rect x="65.0" y="349.0" width="36.0" height="36.0" fill="#cfe9de" stroke="#667789"/><rect x="101.0" y="313.0" width="36.0" height="36.0" fill="#cfe9de" stroke="#667789"/><rect x="101.0" y="349.0" width="36.0" height="36.0" fill="#cfe9de" stroke="#667789"/><text x="153" y="357" font-size="27" font-weight="normal">+</text><rect x="197.0" y="313.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="197.0" y="331.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="197.0" y="349.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="197.0" y="367.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="215.0" y="313.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="215.0" y="331.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="215.0" y="349.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="215.0" y="367.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="233.0" y="313.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="233.0" y="331.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="233.0" y="349.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="233.0" y="367.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="251.0" y="313.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="251.0" y="331.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="251.0" y="349.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="251.0" y="367.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><text x="301" y="338" font-size="20" font-weight="normal">Груба ознака c(t) + звичайна деталь f(t)</text><text x="301" y="372" font-size="19" font-weight="normal">Той самий фізичний час, два масштаби.</text><text x="65" y="416" font-size="18" font-weight="normal">Схематичні сітки: кольори позначають рівні, не величину помилки.</text><rect x="65.0" y="503.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="65.0" y="521.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="65.0" y="539.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="65.0" y="557.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="83.0" y="503.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="83.0" y="521.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="83.0" y="539.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="83.0" y="557.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="101.0" y="503.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="101.0" y="521.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="101.0" y="539.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="101.0" y="557.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="119.0" y="503.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="119.0" y="521.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="119.0" y="539.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><rect x="119.0" y="557.0" width="18.0" height="18.0" fill="#f8dfad" stroke="#667789"/><text x="153" y="547" font-size="27" font-weight="normal">+</text><rect x="197.0" y="503.0" width="36.0" height="36.0" fill="#cfe9de" stroke="#667789"/><rect x="197.0" y="539.0" width="36.0" height="36.0" fill="#cfe9de" stroke="#667789"/><rect x="233.0" y="503.0" width="36.0" height="36.0" fill="#cfe9de" stroke="#667789"/><rect x="233.0" y="539.0" width="36.0" height="36.0" fill="#cfe9de" stroke="#667789"/><text x="301" y="528" font-size="20" font-weight="normal">Деталь f(t) + груба підтримка іншого часу</text><text x="301" y="562" font-size="19" font-weight="normal">Заміна c(t) звільняє ресурс для c(t′).</text><text x="65" y="606" font-size="18" font-weight="normal">Кількість і вік доданих моментів визначає фізичний план пакета.</text><rect x="65.0" y="693.0" width="36.0" height="36.0" fill="#cfe9de" stroke="#667789"/><rect x="65.0" y="729.0" width="36.0" height="36.0" fill="#cfe9de" stroke="#667789"/><rect x="101.0" y="693.0" width="36.0" height="36.0" fill="#cfe9de" stroke="#667789"/><rect x="101.0" y="729.0" width="36.0" height="36.0" fill="#cfe9de" stroke="#667789"/><text x="153" y="737" font-size="27" font-weight="normal">+</text><rect x="197.0" y="693.0" width="18.0" height="18.0" fill="#e6d4ed" stroke="#667789"/><rect x="197.0" y="711.0" width="18.0" height="18.0" fill="#e6d4ed" stroke="#667789"/><rect x="197.0" y="729.0" width="18.0" height="18.0" fill="#e6d4ed" stroke="#667789"/><rect x="197.0" y="747.0" width="18.0" height="18.0" fill="#e6d4ed" stroke="#667789"/><rect x="215.0" y="693.0" width="18.0" height="18.0" fill="#e6d4ed" stroke="#667789"/><rect x="215.0" y="711.0" width="18.0" height="18.0" fill="#e6d4ed" stroke="#667789"/><rect x="215.0" y="729.0" width="18.0" height="18.0" fill="#e6d4ed" stroke="#667789"/><rect x="215.0" y="747.0" width="18.0" height="18.0" fill="#e6d4ed" stroke="#667789"/><rect x="233.0" y="693.0" width="18.0" height="18.0" fill="#e6d4ed" stroke="#667789"/><rect x="233.0" y="711.0" width="18.0" height="18.0" fill="#e6d4ed" stroke="#667789"/><rect x="233.0" y="729.0" width="18.0" height="18.0" fill="#e6d4ed" stroke="#667789"/><rect x="233.0" y="747.0" width="18.0" height="18.0" fill="#e6d4ed" stroke="#667789"/><rect x="251.0" y="693.0" width="18.0" height="18.0" fill="#e6d4ed" stroke="#667789"/><rect x="251.0" y="711.0" width="18.0" height="18.0" fill="#e6d4ed" stroke="#667789"/><rect x="251.0" y="729.0" width="18.0" height="18.0" fill="#e6d4ed" stroke="#667789"/><rect x="251.0" y="747.0" width="18.0" height="18.0" fill="#e6d4ed" stroke="#667789"/><text x="301" y="718" font-size="20" font-weight="normal">Груба основа + залишкова детальна ознака</text><text x="301" y="752" font-size="19" font-weight="normal">Різниця проєкцій деталі та її грубого батька.</text><text x="65" y="796" font-size="18" font-weight="normal">Однаковий час t; різниця у просторі ознак, а не піксельна помилка.</text></g></svg>
