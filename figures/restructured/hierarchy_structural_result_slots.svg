<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440"><rect width="1000" height="440" fill="white"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#172c3e"><text x="24" y="35" font-size="25" font-weight="bold">Структура контексту: місця для графіків</text><rect x="24" y="60" width="952" height="150" rx="8" fill="#edf3f7" stroke="#667789"/><text x="44" y="90" font-size="23" font-weight="bold">Місткість і розподіл</text><text x="44" y="124" font-size="20" font-weight="normal">Вісь x: токенний бюджет / політика; y: MSE h=4.</text><text x="44" y="154" font-size="20" font-weight="normal">Окремі ініціалізації; FRT-значення наведено в таблиці.</text><text x="44" y="184" font-size="20" font-weight="normal">Результат очікується — вимірювань або прогнозів тут не зображено.</text><rect x="24" y="240" width="952" height="150" rx="8" fill="#edf3f7" stroke="#667789"/><text x="44" y="270" font-size="23" font-weight="bold">Підтримка і розміщення</text><text x="44" y="304" font-size="20" font-weight="normal">CEX: досяжність і вартість; STS: K × часовий розклад.</text><text x="44" y="334" font-size="20" font-weight="normal">Потрібні перевірені результати всіх відповідних комірок.</text><text x="44" y="364" font-size="20" font-weight="normal">Результат очікується — вимірювань або прогнозів тут не зображено.</text></g></svg>
