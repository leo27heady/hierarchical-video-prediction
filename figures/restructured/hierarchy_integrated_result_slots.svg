<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440"><rect width="1000" height="440" fill="white"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#172c3e"><text x="24" y="35" font-size="25" font-weight="bold">Якість предиктора: місця для прикладів</text><rect x="24" y="60" width="952" height="150" rx="8" fill="#edf3f7" stroke="#667789"/><text x="44" y="90" font-size="23" font-weight="bold">Moving MNIST, 10 → 10</text><text x="44" y="124" font-size="20" font-weight="normal">Контекст → еталонні кадри → прогнози → помилки.</text><text x="44" y="154" font-size="20" font-weight="normal">Фіксовані кліпи, горизонти та спільний масштаб яскравості.</text><text x="44" y="184" font-size="20" font-weight="normal">Результат очікується — вимірювань або прогнозів тут не зображено.</text><rect x="24" y="240" width="952" height="150" rx="8" fill="#edf3f7" stroke="#667789"/><text x="44" y="270" font-size="23" font-weight="bold">TaxiBJ, 4 → 4</text><text x="44" y="304" font-size="20" font-weight="normal">Контекст → еталонні канали потоку → прогнози → помилки.</text><text x="44" y="334" font-size="20" font-weight="normal">Однакові одиниці та нормалізація; канали показуються окремо.</text><text x="44" y="364" font-size="20" font-weight="normal">Результат очікується — вимірювань або прогнозів тут не зображено.</text></g></svg>
