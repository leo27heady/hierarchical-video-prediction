<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="805" viewBox="0 0 1000 805"><rect width="1000" height="805" fill="white"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#172c3e"><text x="24" y="35" font-size="27" font-weight="bold">Місткість, підтримка та розміщення деталей</text><rect x="24" y="55" width="952" height="150" rx="8" fill="#edf3f7" stroke="#667789"/><text x="44" y="85" font-size="23" font-weight="bold">А. Однаковий бюджет 1 792 токени</text><text x="44" y="119" font-size="20" font-weight="normal">Плоский: 28 моментів × 64 деталі = 1 792</text><text x="44" y="149" font-size="20" font-weight="normal">Ієрархічний: 56 × 16 грубих + 896 деталей = 1 792</text><text x="44" y="179" font-size="20" font-weight="normal">Часова підтримка різна; грубі й детальні моменти можуть збігатися.</text><text x="44" y="239" font-size="19" font-weight="normal">Давніше</text><text x="786" y="239" font-size="19" font-weight="normal">Недавнє →</text><rect x="44" y="252" width="850" height="34" rx="8" fill="#cfe9de" stroke="#667789"/><text x="58" y="276" font-size="18" font-weight="normal">Груба підтримка: 56 моментів</text><rect x="681.5" y="300" width="212.5" height="34" rx="8" fill="#f8dfad" stroke="#667789"/><text x="44" y="324" font-size="18" font-weight="normal">896 деталей = 14 повних недавніх моментів →</text><text x="44" y="361" font-size="18" font-weight="normal">Смуги: приклад недавнього розподілу, 14 із 56 вкладених моментів.</text><rect x="24" y="385" width="952" height="150" rx="8" fill="#edf3f7" stroke="#667789"/><text x="44" y="415" font-size="23" font-weight="bold">Б. Додавання грубої історії (CEX)</text><text x="44" y="449" font-size="20" font-weight="normal">6 повних детальних моментів = 384 токени; грубі починаються з віку 7.</text><text x="44" y="479" font-size="20" font-weight="normal">Грубих моментів: 0 → 4 → 8 → 16 → 32 → 64</text><text x="44" y="509" font-size="20" font-weight="normal">Вартість: 384 → 448 → 512 → 640 → 896 → 1 408 токенів</text><rect x="24" y="555" width="952" height="150" rx="8" fill="#edf3f7" stroke="#667789"/><text x="44" y="585" font-size="23" font-weight="bold">В. Стала глобальна квота деталей (STS)</text><text x="44" y="619" font-size="20" font-weight="normal">96 × 16 грубих + 256 деталей = 1 792 токени</text><text x="44" y="649" font-size="20" font-weight="normal">K=64 → 4 моменти; K=32 → 8 моментів;</text><text x="44" y="679" font-size="20" font-weight="normal">K=16 → 16 моментів; K=8 → 32 моменти.</text><text x="44" y="744" font-size="20" font-weight="normal">Розклад моментів: недавній / рівномірний / геометричний.</text><text x="44" y="779" font-size="18" font-weight="normal">Схема планів. Жодна смуга чи число не позначає виміряну якість.</text></g></svg>
