<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400"><title>What is reconstructed during reverse differentiation?</title><rect width="1100" height="400" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#202b36;font-size:18px} .title{font-size:25px;font-weight:bold} .small{font-size:15px}</style><text x="35" y="40" class="title">What is reconstructed during reverse differentiation?</text><rect x="35" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#2675ad" stroke-width="3"/><text x="50" y="118" style="font-weight:bold">Recover state</text><text x="50" y="143" style="font-weight:normal">Retain the terminal paired state.</text><text x="50" y="168" style="font-weight:normal">Invert one coupling block from</text><text x="50" y="193" style="font-weight:normal">its output.</text><path d="M 357 195 h 27 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/><rect x="392" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#5b326f" stroke-width="3"/><text x="407" y="118" style="font-weight:bold">Replay local graph</text><text x="407" y="143" style="font-weight:normal">Recompute the deterministic local</text><text x="407" y="168" style="font-weight:normal">transition and its</text><text x="407" y="193" style="font-weight:normal">adjoint/parameter derivatives.</text><path d="M 714 195 h 27 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/><rect x="749" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#444b55" stroke-width="3"/><text x="764" y="118" style="font-weight:bold">Accumulate / release</text><text x="764" y="143" style="font-weight:normal">Add gradients, release local</text><text x="764" y="168" style="font-weight:normal">intermediates, continue backward.</text><text x="764" y="193" style="font-weight:normal">Keep ordinary boundaries.</text><text class="small" x="35" y="352">A storage schedule, not a prediction-quality claim. Recomputing has a runtime cost.</text></svg>
