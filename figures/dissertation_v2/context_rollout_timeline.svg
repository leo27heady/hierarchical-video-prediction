<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400"><title>When does a four-frame endpoint become a self-fed rollout?</title><rect width="1100" height="400" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#202b36;font-size:18px} .title{font-size:25px;font-weight:bold} .small{font-size:15px}</style><text x="35" y="40" class="title">When does a four-frame endpoint become a self-fed rollout?</text><rect x="35" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#444b55" stroke-width="3"/><text x="50" y="118" style="font-weight:bold">Observed history</text><text x="50" y="143" style="font-weight:normal">Warm from ground truth. Every</text><text x="50" y="168" style="font-weight:normal">retained age precedes the</text><text x="50" y="193" style="font-weight:normal">prediction origin.</text><path d="M 357 195 h 27 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/><rect x="392" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#2675ad" stroke-width="3"/><text x="407" y="118" style="font-weight:bold">Four-frame output</text><text x="407" y="143" style="font-weight:normal">The v2 endpoint stops here.</text><text x="407" y="168" style="font-weight:normal">Evaluate the fourth-frame error</text><text x="407" y="193" style="font-weight:normal">separately from context age.</text><path d="M 714 195 h 27 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/><rect x="749" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#c66a13" stroke-width="3"/><text x="764" y="118" style="font-weight:bold">Optional next call</text><text x="764" y="143" style="font-weight:normal">Only in a rollout: update causal</text><text x="764" y="168" style="font-weight:normal">memory with predictions, advance</text><text x="764" y="193" style="font-weight:normal">by four, predict again.</text><text class="small" x="35" y="352">Legacy or separately authorized rollout path. No backpropagation through the full forecast in the v2 endpoint.</text></svg>
