<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400"><title>How should a resource-constrained predictor be chosen?</title><rect width="1100" height="400" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#202b36;font-size:18px} .title{font-size:25px;font-weight:bold} .small{font-size:15px}</style><text x="35" y="40" class="title">How should a resource-constrained predictor be chosen?</text><rect x="35" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#444b55" stroke-width="3"/><text x="50" y="118" style="font-weight:bold">Locate bottleneck</text><text x="50" y="143" style="font-weight:normal">Missing past evidence? Lost</text><text x="50" y="168" style="font-weight:normal">identity? Training tape? Uneven</text><text x="50" y="193" style="font-weight:normal">spatial information?</text><path d="M 357 195 h 27 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/><rect x="392" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#2675ad" stroke-width="3"/><text x="407" y="118" style="font-weight:bold">Match intervention</text><text x="407" y="143" style="font-weight:normal">Context allocation; preserved</text><text x="407" y="168" style="font-weight:normal">fine detail;</text><text x="407" y="193" style="font-weight:normal">checkpoint/reversible execution;</text><text x="407" y="218" style="font-weight:normal">route/quota study.</text><path d="M 714 195 h 27 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/><rect x="749" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#5b326f" stroke-width="3"/><text x="764" y="118" style="font-weight:bold">Measure and decide</text><text x="764" y="143" style="font-weight:normal">Matched quality, memory,</text><text x="764" y="168" style="font-weight:normal">throughput and stability. Accept,</text><text x="764" y="193" style="font-weight:normal">narrow, or reject the proposed</text><text x="764" y="218" style="font-weight:normal">advantage.</text><text class="small" x="35" y="352">A conditional decision rule. Component ratios from different resources and baselines never multiply.</text></svg>
