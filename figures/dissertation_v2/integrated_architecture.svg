<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400"><title>How can packing and internal reversibility coexist?</title><rect width="1100" height="400" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#202b36;font-size:18px} .title{font-size:25px;font-weight:bold} .small{font-size:15px}</style><text x="35" y="40" class="title">How can packing and internal reversibility coexist?</text><rect x="35" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#c66a13" stroke-width="3"/><text x="50" y="118" style="font-weight:bold">Ordinary boundary</text><text x="50" y="143" style="font-weight:normal">CNN fine/coarse pyramid. Score</text><text x="50" y="168" style="font-weight:normal">and gather K fine tokens; retain</text><text x="50" y="193" style="font-weight:normal">dense coarse coverage.</text><path d="M 357 195 h 27 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/><rect x="392" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#5b326f" stroke-width="3"/><text x="407" y="118" style="font-weight:bold">Reversible core</text><text x="407" y="143" style="font-weight:normal">Packed features + physical</text><text x="407" y="168" style="font-weight:normal">metadata. Additive coupling;</text><text x="407" y="193" style="font-weight:normal">ordinary and reversible modes</text><text x="407" y="218" style="font-weight:normal">share weights/function.</text><path d="M 714 195 h 27 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/><rect x="749" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#2675ad" stroke-width="3"/><text x="764" y="118" style="font-weight:bold">Ordinary decoder</text><text x="764" y="143" style="font-weight:normal">Future coarse queries attend to</text><text x="764" y="168" style="font-weight:normal">memory. Upsample residual and add</text><text x="764" y="193" style="font-weight:normal">the last observed frame.</text><text class="small" x="35" y="352">Encoder/router/decoder remain outside the inverse. Dense candidates and boundary state still contribute to total</text><text class="small" x="35" y="372">memory.</text></svg>
