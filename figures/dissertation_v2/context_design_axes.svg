<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400"><title>What changes when a context package changes?</title><rect width="1100" height="400" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#202b36;font-size:18px} .title{font-size:25px;font-weight:bold} .small{font-size:15px}</style><text x="35" y="40" class="title">What changes when a context package changes?</text><rect x="35" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#444b55" stroke-width="3"/><text x="50" y="118" style="font-weight:bold">Payload</text><text x="50" y="143" style="font-weight:normal">Count retained tokens and bytes</text><text x="50" y="168" style="font-weight:normal">explicitly. Keep target cost</text><text x="50" y="193" style="font-weight:normal">separate.</text><rect x="392" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#2675ad" stroke-width="3"/><text x="407" y="118" style="font-weight:bold">Age / reach</text><text x="407" y="143" style="font-weight:normal">Identify the oldest available</text><text x="407" y="168" style="font-weight:normal">observation. Nominal access is</text><text x="407" y="193" style="font-weight:normal">not successful retrieval.</text><rect x="749" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#c66a13" stroke-width="3"/><text x="764" y="118" style="font-weight:bold">Spatial detail</text><text x="764" y="143" style="font-weight:normal">Record cells at each age and</text><text x="764" y="168" style="font-weight:normal">level. Coarse coverage can lose</text><text x="764" y="193" style="font-weight:normal">fine identity.</text><text class="small" x="35" y="352">Design coordinates, not a measured frontier. Longer retained history is not a longer forecast.</text></svg>
