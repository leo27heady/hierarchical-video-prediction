<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400"><title>Which evidence transfers from V-BLT to the router?</title><rect width="1100" height="400" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#202b36;font-size:18px} .title{font-size:25px;font-weight:bold} .small{font-size:15px}</style><text x="35" y="40" class="title">Which evidence transfers from V-BLT to the router?</text><rect x="35" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#2675ad" stroke-width="3"/><text x="50" y="118" style="font-weight:bold">Published V-BLT</text><text x="50" y="143" style="font-weight:normal">Fixed local/global patches, RoPE-</text><text x="50" y="168" style="font-weight:normal">ND, categorical byte prediction</text><text x="50" y="193" style="font-weight:normal">and entropy diagnosis.</text><path d="M 357 195 h 27 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/><rect x="392" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#444b55" stroke-width="3"/><text x="407" y="118" style="font-weight:bold">Motivated question</text><text x="407" y="143" style="font-weight:normal">Spatial complexity is uneven.</text><text x="407" y="168" style="font-weight:normal">Where should a finite detail</text><text x="407" y="193" style="font-weight:normal">quota be allocated?</text><path d="M 714 195 h 27 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/><rect x="749" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#c66a13" stroke-width="3"/><text x="764" y="118" style="font-weight:bold">Separate integration</text><text x="764" y="143" style="font-weight:normal">Residual/change/learned scores,</text><text x="764" y="168" style="font-weight:normal">physical Fourier metadata and a</text><text x="764" y="193" style="font-weight:normal">real gather. New evidence</text><text x="764" y="218" style="font-weight:normal">required.</text><text class="small" x="35" y="352">No inherited router-quality or memory claim. Entropy was not the executed integrated route score.</text></svg>
