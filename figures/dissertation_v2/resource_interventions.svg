<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580"><title>Four distinct memory terms, with distinct intervention points</title><rect width="1100" height="580" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#202b36;font-size:18px} .title{font-size:25px;font-weight:bold} .small{font-size:15px}</style><text x="35" y="40" class="title">Four distinct memory terms, with distinct intervention points</text><rect x="35" y="75" width="1020" height="100" rx="9" fill="#f6f8fb" stroke="#2675ad" stroke-width="3"/><text x="50" y="105" style="font-weight:bold">Retained context/state</text><text x="50" y="130" style="font-weight:normal">Spatial/temporal allocation; quota changes. Routing at equal K changes membership, not count.</text><rect x="35" y="190" width="1020" height="100" rx="9" fill="#f6f8fb" stroke="#5b326f" stroke-width="3"/><text x="50" y="220" style="font-weight:bold">Internal activations</text><text x="50" y="245" style="font-weight:normal">Ordinary autograd, checkpointing or same-forward reversible core execution.</text><rect x="35" y="305" width="1020" height="100" rx="9" fill="#f6f8fb" stroke="#444b55" stroke-width="3"/><text x="50" y="335" style="font-weight:bold">Parameters / optimizer</text><text x="50" y="360" style="font-weight:normal">Weights, gradients and optimizer state. Not removed by context packing or replay.</text><rect x="35" y="420" width="1020" height="100" rx="9" fill="#f6f8fb" stroke="#c66a13" stroke-width="3"/><text x="50" y="450" style="font-weight:bold">Workspace / boundaries</text><text x="50" y="475" style="font-weight:normal">Dense encoder candidates, decoder state, temporary kernels and allocator reserve.</text></svg>
