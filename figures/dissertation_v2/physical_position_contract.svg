<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400"><title>Why does changing packed order not change physical identity?</title><rect width="1100" height="400" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#202b36;font-size:18px} .title{font-size:25px;font-weight:bold} .small{font-size:15px}</style><text x="35" y="40" class="title">Why does changing packed order not change physical identity?</text><rect x="35" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#2675ad" stroke-width="3"/><text x="50" y="118" style="font-weight:bold">Physical identity</text><text x="50" y="143" style="font-weight:normal">Cell-centre x/y, signed time,</text><text x="50" y="168" style="font-weight:normal">cell scale, and level. Normalize</text><text x="50" y="193" style="font-weight:normal">by grid and protocol.</text><path d="M 357 195 h 27 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/><rect x="392" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#c66a13" stroke-width="3"/><text x="407" y="118" style="font-weight:bold">Gather together</text><text x="407" y="143" style="font-weight:normal">Feature and metadata follow the</text><text x="407" y="168" style="font-weight:normal">same selected index. Packed slot</text><text x="407" y="193" style="font-weight:normal">is not a coordinate.</text><path d="M 714 195 h 27 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/><rect x="749" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#5b326f" stroke-width="3"/><text x="764" y="118" style="font-weight:bold">Position + attention</text><text x="764" y="143" style="font-weight:normal">Fourier features and level</text><text x="764" y="168" style="font-weight:normal">embedding. Future queries use the</text><text x="764" y="193" style="font-weight:normal">same physical convention.</text><text class="small" x="35" y="352">CPU fp32 permutation check is bounded evidence; deployed mixed-precision verification remains a separate gate.</text></svg>
