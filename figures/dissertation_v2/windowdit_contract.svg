<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400"><title>Where are observations, targets, and trainable computation separated?</title><rect width="1100" height="400" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#202b36;font-size:18px} .title{font-size:25px;font-weight:bold} .small{font-size:15px}</style><text x="35" y="40" class="title">Where are observations, targets, and trainable computation separated?</text><rect x="35" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#444b55" stroke-width="3"/><text x="50" y="118" style="font-weight:bold">Frozen observations</text><text x="50" y="143" style="font-weight:normal">TRB frames to cached coarse/fine</text><text x="50" y="168" style="font-weight:normal">latents. Training-only channel</text><text x="50" y="193" style="font-weight:normal">normalization.</text><path d="M 357 195 h 27 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/><rect x="392" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#2675ad" stroke-width="3"/><text x="407" y="118" style="font-weight:bold">Manifest gather</text><text x="407" y="143" style="font-weight:normal">Exact ages and physical fine</text><text x="407" y="168" style="font-weight:normal">cells. Transfer the selected</text><text x="407" y="193" style="font-weight:normal">payload, not padded candidates.</text><path d="M 714 195 h 27 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/><rect x="749" y="88" width="316" height="230" rx="9" fill="#f6f8fb" stroke="#5b326f" stroke-width="3"/><text x="764" y="118" style="font-weight:bold">WindowDiT</text><text x="764" y="143" style="font-weight:normal">Joint context + noisy four-frame</text><text x="764" y="168" style="font-weight:normal">target attention. Decode four</text><text x="764" y="193" style="font-weight:normal">predictions; no clean target in</text><text x="764" y="218" style="font-weight:normal">context.</text><text class="small" x="35" y="352">Controlled allocation experiment. Frozen codec differs from the end-to-end OpenSTL encoder.</text></svg>
